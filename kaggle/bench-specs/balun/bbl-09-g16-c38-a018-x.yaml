# editcap-bench-v1 balun spec (circuit_class: balun-lna). Generated by bench_grid.py.
# Single-ended-in / differential-out LNA. Metrics from lna/balun_harness.py
# (reuses diff3 mixed-mode): sds21_db, cmrr_db, imbalance_amp_db,
# imbalance_phase_deg. Ports (diff3 3-port): port1=single-ended RF in (VIN1),
# port2=INVERTING out (VOUT1), port3=NON-INVERTING out (VOUT2, harness conv).
# OBJECTIVE-GAP (PARTIAL, LOUD): sds21/cmrr/imbalance MEASURED ONLY by
# balun_harness (NOT in make_objective) -> status:unsupported. BUT nf_db/s11_db/
# idd_ma ARE computed in-loop (real LNA front) and gate normally, so balun cells
# are PARTIALLY sizable. Closing gap = wire balun_harness (diff3) into the loop.
# Screen: single-ended INPUT (differential:false) + inductor-bearing front.
# pdk bptm45 default; RUN on gf180 via --pdk gf180mcu.
# Band 900mhz (0.915 GHz); Sds21 16 dB, CMRR 38 dB, imb 0.18 dB/0.6 deg.

name: bbl-09-g16-c38-a018-x
circuit_class: balun-lna
description: "editcap-bench-v1 balun 900mhz 0.915 GHz single-ended-in/diff-out (Sds21>=16 CMRR>=38 imbAmp<=0.18 imbPh<=0.6)"
pdk: bptm45

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 9.15e+08
  f_lo: 9.02e+08
  f_hi: 9.28e+08

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  sds21_db:            {min: 16, status: unsupported}
  nf_db:               {max: 3}
  s11_db:              {max: -10}
  idd_ma:              {max: 8}
  imbalance_amp_db:    {max: 0.18, status: unsupported}
  imbalance_phase_deg: {max: 0.6, status: unsupported}
  cmrr_db:             {min: 38, status: unsupported}

objectives:
  - {metric: sds21_db, direction: max, weight: 1}
  - {metric: nf_db, direction: min, weight: 0.5}
  - {metric: idd_ma, direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [4, 20]
  max_inductors: 4
  l_min: 3e-10
  l_max: 1.2e-08
  allow_inductorless: false

sizing:
  w_um: [1, 200]
  l_fixed: 4.5e-08
  r_ohm: [50, 20000.0]
  c_f: [5e-14, 1e-11]
  vb_v: [0.2, 0.9]

