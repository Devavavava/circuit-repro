# editcap-bench-v1 spec (USER-COMMISSIONED benchmark). Generated by
# kaggle/bench_grid.py. NOT frozen protocol; adoption is a USER RULING.
# circuit_class lna: all four gates (S21/NF/S11/Idd) are computed INSIDE the
# sizing loop (make_objective->eval_metrics), so NO objective-gap. Numbers are
# round published-practice LNA figures; envelope copied from the real specs.
# pdk: bptm45 default; RUN on gf180 via --pdk gf180mcu (run-time override).
# iip3_dbm carried as status:unsupported (advisory; not gated, like the ladder).
# Band 900mhz (0.915 GHz); joint-tightness gain/g0 (BEYOND the 24-ladder).

name: bnl-09-gain-g0
description: "editcap-bench-v1 LNA 900mhz gain tier: 0.915 GHz LNA (S21>=20 NF<=2.5 Idd<=8 S11<=-12)"
pdk: bptm45

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 9.15e+08
  f_lo: 9.02e+08
  f_hi: 9.28e+08

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:               {max: 2.5}
  s11_db:              {max: -12}
  s21_db:              {min: 20}
  idd_ma:              {max: 8}
  iip3_dbm:            {min: -10, status: unsupported}

objectives:
  - {metric: s21_db, direction: max, weight: 1}
  - {metric: nf_db, direction: min, weight: 0.5}
  - {metric: idd_ma, direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 16]
  allow_inductorless: false
  max_inductors: 4
  l_min: 3e-10
  l_max: 1.5e-08

sizing:
  w_um: [1, 200]
  l_fixed: 4.5e-08
  r_ohm: [50, 20000.0]
  c_f: [5e-14, 1e-11]
  vb_v: [0.2, 0.9]

