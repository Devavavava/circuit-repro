# editcap-bench-v1 spec (USER-COMMISSIONED benchmark). Generated by
# kaggle/bench_grid.py. NOT frozen protocol; adoption is a USER RULING.
# circuit_class lna: all four gates (S21/NF/S11/Idd) are computed INSIDE the
# sizing loop (make_objective->eval_metrics), so NO objective-gap. Numbers are
# round published-practice LNA figures; envelope copied from the real specs.
# pdk: bptm45 default; RUN on gf180 via --pdk gf180mcu (run-time override).
# iip3_dbm carried as status:unsupported (advisory; not gated, like the ladder).
# Wideband 0.5-3 GHz; band-wide S11 + ripple; joint-tightness beyond the 2 wideband ladder cells.

name: bnl-wb-r15-s14-10
description: "editcap-bench-v1 LNA wideband 0.5-3 GHz LNA (NF<=2.5 S11_max<=-15 S21>=14 ripple<=1.5 Idd<=5)"
pdk: bptm45

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: wideband
  f0: 1.75e+09
  f_lo: 5e+08
  f_hi: 3e+09

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:               {max: 2.5}
  s11_max_db:          {max: -15}
  s21_db:              {min: 14}
  s21_ripple_db:       {max: 1.5}
  idd_ma:              {max: 5}
  iip3_dbm:            {min: 5, status: unsupported}

objectives:
  - {metric: nf_db, direction: min, weight: 1}
  - {metric: s21_db, direction: max, weight: 0.5}
  - {metric: idd_ma, direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 16]
  allow_inductorless: true
  max_inductors: 1
  l_min: 3e-10
  l_max: 1e-08

sizing:
  w_um: [1, 200]
  l_fixed: 4.5e-08
  r_ohm: [50, 20000.0]
  c_f: [5e-14, 1e-11]
  vb_v: [0.2, 0.9]

