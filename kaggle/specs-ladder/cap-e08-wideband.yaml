# capability-v0 EXPERIMENTAL spec -- NOT frozen protocol.
# Generated by kaggle/specs-ladder/_gen_ladder.py for the overnight
# capability-estimate campaign (kaggle/CAMPAIGN-CAPABILITY-V0.md).
# Adoption/freezing of any target here is a USER RULING (governance).
# Numbers are round published-practice figures or relaxed/tightened steps
# off wifi24 / ism58 / gps-l1; device_budget/l_min/l_max/sizing copied from
# those real specs. iip3_dbm declared unsupported (advisory-only via
# verify.py; NOT gated anywhere in this ladder). Tier: E  (loose everything -- sanity floor)

# Wideband 0.5-3 GHz, loosest. Reuses the wideband screen (allow_inductorless, band-wide S11/ripple) at relaxed thresholds; the inductorless-class sanity floor.

name: cap-e08-wideband
description: "capability-v0 E tier: wideband 0.5-3 GHz LNA (NF<=3.5 S11_max<=-8 S21>=10 Idd<=15)"

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: wideband
  f0: 1.75e+09
  f_lo: 5e+08
  f_hi: 3e+09

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:       {max: 3.5}
  s11_max_db:  {max: -8}
  s21_db:      {min: 10}
  s21_ripple_db: {max: 2.0}
  idd_ma:      {max: 15}
  iip3_dbm:    {min: 5, status: unsupported}

objectives:
  - {metric: nf_db, direction: min, weight: 1.0}
  - {metric: s21_db, direction: max, weight: 0.5}
  - {metric: idd_ma, direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 16]
  allow_inductorless: true
  max_inductors: 1
  l_min: 3e-10
  l_max: 1e-08

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
