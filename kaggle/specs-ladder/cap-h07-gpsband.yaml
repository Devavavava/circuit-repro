# capability-v0 EXPERIMENTAL spec -- NOT frozen protocol.
# Generated by kaggle/specs-ladder/_gen_ladder.py for the overnight
# capability-estimate campaign (kaggle/CAMPAIGN-CAPABILITY-V0.md).
# Adoption/freezing of any target here is a USER RULING (governance).
# Numbers are round published-practice figures or relaxed/tightened steps
# off wifi24 / ism58 / gps-l1; device_budget/l_min/l_max/sizing copied from
# those real specs. iip3_dbm declared unsupported (advisory-only via
# verify.py; NOT gated anywhere in this ladder). Tier: H  (tight combination -- low NF + tight match + low power at once)

# GPS, extreme. NF 1.5 + S21 20 (the top of the gain axis) + Idd 3 -- the corner where noise, gain and power all bind.

name: cap-h07-gpsband
description: "capability-v0 H tier: 1.58 GHz LNA (NF<=1.5 S11<=-14 S21>=20 Idd<=3)"

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 1.57542e+09
  f_lo: 1.565e+09
  f_hi: 1.586e+09

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:       {max: 1.5}
  s11_db:      {max: -14}
  s21_db:      {min: 20}
  idd_ma:      {max: 3}
  iip3_dbm:    {min: -3, status: unsupported}

objectives:
  - {metric: nf_db, direction: min, weight: 1.0}
  - {metric: s21_db, direction: max, weight: 0.5}
  - {metric: idd_ma, direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 16]
  allow_inductorless: false
  max_inductors: 4
  l_min: 3e-10
  l_max: 1.5e-08

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
