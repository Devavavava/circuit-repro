# ============================================================================
# EXPERIMENTAL DRAFT -- balun / differential-output LNA example
# (circuit_class: balun-lna). Not a campaign target. Illustrates the balun class
# metric vocabulary and the balun_harness.py measurements (which reuse diff3's
# mixed-mode engine; golden: lna/ref/check_balun.py). Unlike pa/mixer this class
# DOES have a meaningful structural screen -- a balun-LNA is single-ended-in /
# differential-out -- so the topology block asserts a real single input and an
# inductor-bearing RF front (the D7 lineage). Targets mirror the tier-3
# differential requirement (imbalance <= 0.22 dB / <= 0.9 deg) already used in
# lna/_diff_balun.py. NF and Sds21 gate; imbalance/CMRR gate.
# ============================================================================
name: balunlna24-example
circuit_class: balun-lna
description: EXPERIMENTAL DRAFT 2.4 GHz single-ended-in / differential-out LNA example

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 2.442e9
  f_lo: 2.400e9
  f_hi: 2.4835e9

ports:
  z0: 50
  input: VIN1
  output: VOUT1      # the balun's inverting output leg (diff3 port-2 convention)

constraints:
  sds21_db:            {min: 12, status: measured}   # differential forward gain
  nf_db:               {max: 3.0}
  s11_db:              {max: -10}
  idd_ma:              {max: 8}
  imbalance_amp_db:    {max: 0.22, status: measured}
  imbalance_phase_deg: {max: 0.9,  status: measured}
  cmrr_db:             {min: 20,   status: measured}

objectives:
  - {metric: sds21_db, direction: max, weight: 1.0}
  - {metric: nf_db,    direction: min, weight: 0.5}
  - {metric: idd_ma,   direction: min, weight: 0.5}

# Real structural screen (this class is well-defined): single-ended input,
# inductor-bearing narrowband RF front, textbook device budget.
topology:
  differential: false           # single-ended INPUT (the output is differential)
  reject_floating: true
  device_budget: [4, 20]
  max_inductors: 4
  l_min: 0.3e-9
  l_max: 12e-9
  allow_inductorless: false

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
