# WP-DHRUVA blind-protocol spec (plans2/08-DHRUVA-GOAL.md). TIER-1 gateable
# constraints only: S11-held-over-band / S21@f0 / Idd. Numbers are the paper's
# published LNA figures (the ONLY allowed excerpt); no circuit detail is used.
# Rows sized against this spec carry provenance recipe: blind-v1.
# Rail: paper 1.2 V; harness fixes VDD=1.1 V (vdd:1.1 = evaluated condition).
# Idd<=13 mA is generous (not expected to bind). NF is tier-2 and now GATED
# (WP-D1 series-Rs harness); IIP3 stays `unsupported` (tier-3).
# S band is the highest-gain, highest-f0 configuration (>=30 dB @ 2.492 GHz):
# the hardest tier-1 cell.
name: dhruva-s
description: NavIC/GPS S band (2.49203 GHz) LNA, paper-target tier-1 (blind)

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 2.49203e9
  f_lo: 1.1e9        # S11-match sweep spans the whole reconfig range 1.1-2.5 GHz
  f_hi: 2.5e9        # f0 sits at the top edge of the reconfig range (by design)

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  s11_max_db: {max: -10}    # worst-case S11 over 1.1-2.5 GHz
  s21_db:     {min: 30}     # gain at f0 (highest of the four bands)
  idd_ma:     {max: 13}
  nf_db:      {max: 3.5}   # TIER-2, GATED (WP-D1): series-Rs harness,
                          # extract.measure_nf, golden-validated to 3.0103 dB
  iip3_dbm:   {min: -8.7, status: unsupported}   # tier-3, needs two-tone/HB

objectives:
  - {metric: s21_db,     direction: max, weight: 1.0}
  - {metric: s11_max_db, direction: min, weight: 0.5}
  - {metric: idd_ma,     direction: min, weight: 0.5}
  - {metric: nf_db,      direction: min, weight: 0.5}   # tier-2: keep pushing noise down

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 16]
  max_inductors: 6
  l_min: 0.3e-9
  l_max: 15e-9
  allow_inductorless: false

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
