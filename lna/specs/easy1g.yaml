# Capacity-ladder rung R0 (very easy). Synthetic difficulty-ladder spec authored
# 2026-08-26 for the capability test (V0-RETROSPECTIVE follow-up) -- NOT
# silicon-calibrated. A deliberately loose 1.0 GHz narrowband floor: if the
# pipeline's capacity is real, this should always solve. Untuned band.
name: easy1g
description: 1.0 GHz narrowband LNA -- deliberately loose easy floor (ladder R0)

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 1.0e9
  f_lo: 0.95e9
  f_hi: 1.05e9

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:    {max: 4.0}
  s11_db:   {max: -8}
  s21_db:   {min: 8}
  idd_ma:   {max: 12}
  iip3_dbm: {min: -10, status: unsupported}

objectives:
  - {metric: s21_db, direction: max, weight: 1.0}
  - {metric: idd_ma, direction: min, weight: 0.5}
  - {metric: nf_db,  direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 20]
  max_inductors: 3
  l_min: 0.3e-9
  l_max: 20e-9
  allow_inductorless: false

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
