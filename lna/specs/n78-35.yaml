# Capacity-ladder rung R1 (easy). Synthetic difficulty-ladder spec authored
# 2026-08-26 for the capability test -- NOT silicon-calibrated. 3.5 GHz 5G-NR
# n78 cellular band, an untuned band with moderate targets.
name: n78-35
description: 3.5 GHz (5G-NR n78) narrowband LNA -- easy rung (ladder R1)

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 3.5e9
  f_lo: 3.4e9
  f_hi: 3.6e9

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:    {max: 3.0}
  s11_db:   {max: -10}
  s21_db:   {min: 12}
  idd_ma:   {max: 8}
  iip3_dbm: {min: -5, status: unsupported}

objectives:
  - {metric: s21_db, direction: max, weight: 1.0}
  - {metric: idd_ma, direction: min, weight: 0.5}
  - {metric: nf_db,  direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 20]
  max_inductors: 3
  l_min: 0.3e-9
  l_max: 12e-9
  allow_inductorless: false

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
