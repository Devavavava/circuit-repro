# Capacity-ladder rung R2 (moderate). Synthetic difficulty-ladder spec authored
# 2026-08-26 for the capability test -- NOT silicon-calibrated. 0.9 GHz sub-GHz
# IoT/ISM band: lower frequency needs larger tuning inductors (l_max raised to
# 30 nH), so the match is harder to hold at a tight NF.
name: sub900
description: 0.9 GHz sub-GHz IoT-band narrowband LNA -- moderate rung (ladder R2)

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: narrowband
  f0: 0.9e9
  f_lo: 0.86e9
  f_hi: 0.94e9

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:    {max: 2.5}
  s11_db:   {max: -10}
  s21_db:   {min: 15}
  idd_ma:   {max: 6}
  iip3_dbm: {min: -5, status: unsupported}

objectives:
  - {metric: s21_db, direction: max, weight: 1.0}
  - {metric: idd_ma, direction: min, weight: 0.5}
  - {metric: nf_db,  direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 20]
  max_inductors: 3
  l_min: 0.3e-9
  l_max: 30e-9
  allow_inductorless: false

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
