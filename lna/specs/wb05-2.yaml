# Capacity-ladder rung R3 (moderate, different structural class). Synthetic
# difficulty-ladder spec authored 2026-08-26 for the capability test -- NOT
# silicon-calibrated. 0.5-2 GHz wideband, inductorless allowed: exercises the
# resistive-feedback / common-gate / noise-cancelling population, a different
# class from the tuned narrowband designs. s11 and gain-ripple are band-wide.
name: wb05-2
description: 0.5-2 GHz wideband LNA, inductorless-friendly -- moderate rung (ladder R3)

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: wideband
  f0: 1.0e9
  f_lo: 0.5e9
  f_hi: 2.0e9

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:        {max: 3.5}
  s11_max_db:   {max: -10}
  s21_db:       {min: 12}
  s21_ripple_db: {max: 3}
  idd_ma:       {max: 8}
  iip3_dbm:     {min: -5, status: unsupported}

objectives:
  - {metric: nf_db,  direction: min, weight: 1.0}
  - {metric: s21_db, direction: max, weight: 0.5}
  - {metric: idd_ma, direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true
  device_budget: [3, 20]
  max_inductors: 1
  l_min: 0.3e-9
  l_max: 10e-9
  allow_inductorless: true

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
