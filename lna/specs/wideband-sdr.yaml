# Wideband 0.5-3 GHz general-purpose front end (SDR / TV-tuner class).
# Rationale: exercises the inductorless topology population — resistive
# feedback, common-gate, noise-cancelling — i.e. the ~40% of real dataset LNAs
# the old fixed screen rejected (H-Q4). allow_inductorless: true is the point
# of this spec. nf_db / s21_db are checked at the reporting frequency f0 (as
# for the narrowband specs); s11_max_db and s21_ripple_db are genuinely
# band-wide, computed from the L2 sweep over [f_lo, f_hi].
#
# recalibrated: 2026-08-09 from published silicon (see citation block below)
#
# ---- citation block (spec-recalibration pass) ------------------------------
# Blind protocol: Kanchetla et al., IEEE TMTT 2022 (NavIC/GPS receiver) is
# HARD-EXCLUDED from all sourcing below (not searched, not cited, not used) —
# stated regardless of the fact that it is not itself an SDR-LNA paper.
#
# 12 measured-SILICON CMOS wideband/inductorless LNAs surveyed, ~0.1-3 GHz
# class (worst-case S11 / gain / NF-min / power@native-Vdd / inductors / node
# — full citations + the 3-agent survey detail in FINDINGS.md §22):
#   Bruccoleri+Klumperink+Nauta  JSSC'04    0.01-1.6GHz  S11<-10   13.7dB gain  NF<2.4dB   35mW@2.5V    0L  0.25um
#   Blaakmeer+Klumperink+Leenaerts+Nauta JSSC'08 0.3-3.5GHz S11<-14 15dB gain   NF~3.0dB   21mW@1.2V    0L  65nm
#   Amer+Hegazi+Ragaie* JSSC'07   0.1-3.85GHz  S11<-10   12.1dB*gain NF 8.4dB*  9.8mW@1.2V  ?L  90nm
#   Woo+Kim+Lee+Kim+Laskar  TMTT'12  0.3-0.92GHz S11<-10  21dB gain   NF 2.0dB   3.6mW        0L  0.18um
#   Arshad+Ramzan+Wahab  IntegVLSI'18  50-830MHz  S11 -8.9  17dB gain  NF 2.2dB   n/a          0L  130nm
#   Chen+Liu+Boos+Niknejad  JSSC'08  0.8-2.1GHz  n/a       >=14.5dB   NF<2.6dB   17.4mW@1.5V  0L  0.13um
#   Liu+Boon+Dong  TCAS-I'24  0.2-2.85GHz  n/a       20dB gain   NF 2.9dB    1.74mW@0.6V  0L  28nm
#   Parvizi+Allidina+El-Gamal  TMTT'16  0.1-2.2GHz  n/a       12.3dB gain NF 4.9dB    0.4mW@1V     0L  130nm
#   De Souza+Mariano+Taris  TCAS-I'17  ~2.2GHz BW  n/a       21.1dB gain NF 2.0dB    7mW(HL)      0L  130nm
#   Sobhy+Helmy+Hoyos+Entesari+Sanchez-Sinencio TMTT'11 0.1-1.77GHz  RL>10dB  23dB gain  NF 1.85dB  2.8mW@2V   0L  90nm
#   Zhang+Bai+Huang  J.Semicond'13  0.3-0.9GHz  n/a       12.2-15.2dB NF 2.3dB   12.6mW@1.8V  0L  0.18um
#   Bevilacqua+Niknejad+ JSSC'04  3.1-10.6GHz  S11<-10   9.3dB gain  NF 4.0dB   9mW          nL  0.18um
#   * Amer is a merged LNA+downconverter chain, not a standalone LNA — its
#     gain/NF are chain-level; quoted here for its S11/band only.
#   + Bevilacqua is UWB (wider, higher band) and uses on-chip/bondwire
#     inductors — kept as a contrast point, not as inductorless evidence.
#
# What changed and why (each knob checked against the table above; the
# store's 134 existing wideband-sdr L2 rows re-judged under the new numbers,
# no re-simulation — FINDINGS.md §22):
#   s11_max_db (METRIC FIXED, was s11_db): VERIFIED this file's own claim
#     ("constraints hold across the whole band") was FALSE for S11 — s11_db
#     is the extractor's at-f0 spot value, not the worst case over
#     [f_lo,f_hi]; s11_max_db (also computed, just never gated) is. The
#     dhruva-* specs and critic.py's S11_SLOTS both already treat
#     `s11_max_db` as "the" broadband-spec S11 constraint — wideband-sdr was
#     the one spec never updated to match. FIXED to gate s11_max_db.
#     Threshold -10dB unchanged: 6/7 comparable-or-wider-band designs above
#     meet or beat -10dB (only Arshad's -8.9dB misses) — real competent
#     silicon clears it — and, measured here, 0 of the store's 134 rows ever
#     have, even before this fix (best-ever s11_max_db = -9.67dB, and that
#     row is a degenerate near-passive network with S21 = -600 dB, not a
#     working amplifier).
#   nf_db <= 3.5: UNCHANGED. Literature NF-min clusters 1.85-2.9dB (10/12
#     surveyed designs clear 3.5 with margin); only the two most
#     power-starved designs (Parvizi 0.4mW -> 4.9dB) miss it. The store's
#     best-ever NF (4.04dB) has never reached 3.5 either — correctly
#     discriminating between a naive resistive/CG stage and a real
#     noise-cancelling design.
#   s21_db >= 14 (was 12): TIGHTENED. Literature gain clusters 14.5-23dB
#     (10/12 surveyed); the old 12dB floor sat below every design surveyed
#     except two low-power outliers (Parvizi 12.3, Zhang's low end 12.2).
#     14dB stays under the mainstream cluster (still achievable) while
#     retiring the old give-away value.
#   s21_ripple_db <= 2: UNCHANGED. Matches the Blaakmeer group's Blixer
#     follow-on paper's measured "flat +/-1dB to 7GHz" (= 2dB peak-to-peak)
#     almost exactly; the core balun-LNA's own <0.3dB shows tighter is
#     reachable by the best designs, so 2dB stays generous-but-real.
#   idd_ma <= 8 (== 8.8mW at our fixed 1.1V rail): UNCHANGED, but RE-DERIVED
#     via power rather than raw current — the surveyed processes/rails span
#     28nm/0.6V to 0.25um/2.5V, so current alone does not transfer across
#     nodes. Normalizing each design's reported power to our fixed VDD=1.1V
#     (Idd_equiv = P_reported / 1.1V) gives a spread of ~0.36-19.1 mA-equiv
#     (excluding the 35mW/2.5V Bruccoleri outlier); 8mA sits ~65th
#     percentile — generous to modern low-power designs (Liu/Boon/Dong
#     1.6mA-equiv, Parvizi 0.4mA-equiv, Sobhy 2.5mA-equiv all clear it) while
#     still excluding older high-power ones (Chen/Niknejad 15.8, Blaakmeer
#     19.1 mA-equiv). Matches this store's own data: idd_ma was already the
#     least-binding constraint (109/134 rows already <= 8mA).
#
# Net effect measured (FINDINGS §22, re-judged from stored `metrics`, no new
# SPICE): still 0/134 feasible either way. Best total normalized violation
# moves 1.375 -> 2.055 — WORSE in raw terms, because the old number was
# quietly free of any S11 penalty (s11_db passed at -17.7dB on that very row
# while its true worst-case match was -3.6dB) and the new number correctly
# prices that in. NF and ripple remain violated too; nothing here is a
# regression in the design, only in what was being measured.
name: wideband-sdr
description: 0.5-3 GHz wideband SDR front-end LNA, inductorless-friendly

process:
  models: AutoCkt/repo/eval_engines/ngspice/ngspice_inputs/spice_models/45nm_bulk.txt
  vdd: 1.1
  temp: 27

band:
  type: wideband
  f0: 1.75e9          # geometric-ish centre, reporting frequency
  f_lo: 0.5e9
  f_hi: 3.0e9

ports:
  z0: 50
  input: VIN1
  output: VOUT1

constraints:
  nf_db:       {max: 3.5}    # unchanged; literature NF-min clusters 1.85-2.9dB
  s11_max_db:  {max: -10}    # FIXED metric (was s11_db, spot @ f0 only) +
                              # recalibrated -10dB confirmed vs published silicon
  s21_db:      {min: 14}     # TIGHTENED from 12; literature gain clusters 14.5-23dB
  s21_ripple_db: {max: 2}    # unchanged; max-min across band, L2 only
  idd_ma:      {max: 8}      # unchanged; == 8.8mW @ fixed 1.1V rail, power-normalized
  iip3_dbm:    {min: 0, status: unsupported}  # wideband -> linearity matters; harness TBD

objectives:
  - {metric: nf_db,  direction: min, weight: 1.0}
  - {metric: s21_db, direction: max, weight: 0.5}
  - {metric: idd_ma, direction: min, weight: 0.5}

topology:
  differential: false
  reject_floating: true   # H-Q3: reject genuinely disconnected islands
  device_budget: [3, 16]    # widened from 12 after corpus calibration (see wifi24)
  max_inductors: 1          # area-constrained; shunt-peaking at most
  l_min: 0.3e-9
  l_max: 10e-9
  allow_inductorless: true

sizing:
  w_um: [1, 200]
  l_fixed: 45e-9
  r_ohm: [50, 20e3]
  c_f: [50e-15, 10e-12]
  vb_v: [0.2, 0.9]
