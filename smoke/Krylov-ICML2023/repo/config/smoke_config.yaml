# Minimal smoke config: one circuit (nmos), one DL model, CPU, no wandb.
# Paired with a tiny-range config/circuits/nmos/nmos.yaml (5 widths x 3 resistances)
# so dataset generation is ~15 ngspice runs instead of the default ~24k.
dataset:
  - type: Base
model_config:
  - model: Model500GELU
metric: absolute
rerun_training: True
device: cpu
check_circuit: False
num_sample_check: 2
random_sample_scale: 1.5
log_experiments: False
simulator_config:
  num_workers: 2
  sim_size: 10
  multiprocessing: False
epsilon: 0
subset:
  - 0.9
circuits:
  - nmos
compare_dataset: False
compare_method: False
subset_percentage: 0.3
mode: replace
subset_parameter_check: False
independent_sample: True
loss_per_epoch: False
test_accuracy_per_epoch: False
train_accuracy_per_epoch: False
